# nginx site of the drkit demo application. Its own ports, so it never takes over the
# host's default site. `drkit drill` fills in {app_port} and {domain}.
server {
    listen 18080;
    listen 18443 ssl;
    server_name {domain};

    ssl_certificate /etc/letsencrypt/live/{domain}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{domain}/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:{app_port};
        proxy_set_header Host $host;
    }
}
