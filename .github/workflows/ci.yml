name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: shellcheck
        run: shellcheck scripts/*.sh

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - name: Build sdist and wheel
        run: uv build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    env:
      RESTIC_VERSION: 0.18.1
      RESTIC_SHA256: 680838f19d67151adba227e1570cdd8af12c19cf1735783ed1ba928bc41f363d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install restic
        run: |
          curl -fsSL -o restic.bz2 \
            "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          echo "${RESTIC_SHA256}  restic.bz2" | sha256sum --check --strict
          bunzip2 restic.bz2
          sudo install -m 0755 restic /usr/local/bin/restic
          restic version
      - name: Pull service images
        run: docker compose -f tests/integration/compose.yaml pull --quiet
      - run: uv sync --locked
      - name: Run integration tests as root
        # As in production: volume data under /var/lib/docker is only readable by root.
        run: sudo --preserve-env=PATH .venv/bin/python -m pytest -m integration --no-cov -rs

  host:
    name: Host recovery
    # A throwaway runner is the disposable host: bootstrap.sh installs drkit, a project and
    # nginx are backed up and destroyed, and `drkit restore host` rebuilds them (DESIGN §7.3).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Bootstrap the host
        run: sudo DRKIT_SPEC="$PWD" bash scripts/bootstrap.sh
      - name: Bootstrap again (idempotent)
        run: sudo DRKIT_SPEC="$PWD" bash scripts/bootstrap.sh
      - name: Install nginx
        # In production nginx comes from the host's playbook; the hardening playbook used
        # here does not install it.
        run: sudo apt-get install -y -qq nginx
      - name: Pull service images
        run: |
          docker compose -f tests/integration/compose.yaml pull --quiet minio
          docker compose -f tests/integration/demo/compose.yaml pull --quiet
        env:
          DB_PASSWORD: unused
          WEB_PORT: "8080"
      - run: uv sync --locked
      - name: Back up, destroy and restore the host
        run: >-
          sudo --preserve-env=PATH env DRKIT_HOST_TEST=1
          DRKIT_HOST_SUMMARY="$RUNNER_TEMP/host-summary.md"
          .venv/bin/python -m pytest tests/host -m host --no-cov -rs -p no:cacheprovider
      - name: Publish step timings
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/host-summary.md" ] && cat "$RUNNER_TEMP/host-summary.md" >> "$GITHUB_STEP_SUMMARY"
          sudo cp -r /var/lib/drkit/reports host-reports 2>/dev/null || mkdir host-reports
          sudo chown -R "$(id -u)" host-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: host-recovery-reports
          path: host-reports/
          retention-days: 30

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # list the commits of a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
