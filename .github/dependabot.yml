version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker-compose
    directories: [/tests/integration, /tests/integration/demo]
    schedule:
      interval: weekly
    # The database majors under test are deliberate (one per supported line); moving to a
    # new major is a decision for a pull request of its own, not a routine update.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: mysql
        update-types: ["version-update:semver-major"]
      # MariaDB minor versions are separate release lines (11.4 and 11.8 are both LTS).
      - dependency-name: mariadb
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: test
      include: scope
