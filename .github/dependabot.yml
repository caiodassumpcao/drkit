version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # The newest database releases are tested here: every update is welcome.
  - package-ecosystem: docker-compose
    directories: [/tests/integration, /tests/integration/demo, /tests/host/pebble]
    schedule:
      interval: weekly
    commit-message:
      prefix: test
      include: scope

  # The oldest supported releases (DESIGN §1.3): patch updates only, the floor stays put.
  - package-ecosystem: docker-compose
    directory: /tests/integration/oldest
    schedule:
      interval: weekly
    commit-message:
      prefix: test
      include: scope
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: mysql
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: mariadb
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
