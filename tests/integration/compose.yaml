# Throwaway services for integration tests. Credentials below are test-only fixtures.
# Images are pinned by digest (tag kept for readability); Dependabot proposes updates.
# The databases are the newest release of each engine; oldest/compose.yaml overrides them with
# the oldest supported ones (DESIGN §1.3), and CI runs the integration tests against both.
services:
  minio:
    # The upstream minio/minio image is no longer published; pgsty/minio is a maintained
    # community build of the same server.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: drkit-test
      MINIO_ROOT_PASSWORD: drkit-test-only
    ports: ["127.0.0.1::9000"]

  db:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: drkit-test-only
      POSTGRES_DB: shop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shop"]
      interval: 2s
      retries: 60

  mysql:
    image: mysql:26.10.0@sha256:3819b2b23835c4a73c8b022fafc33c8095c0f81c929a8b7a84613d2fba6c52f5
    environment:
      MYSQL_ROOT_PASSWORD: drkit-test-only
      MYSQL_DATABASE: legacy
      MYSQL_USER: app
      MYSQL_PASSWORD: drkit-test-only
    healthcheck:
      # TCP on purpose: the entrypoint's temporary init server only listens on the socket.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdrkit-test-only"]
      interval: 2s
      retries: 90

  mariadb:
    image: mariadb:13.0.2@sha256:f4054da26e3a9dd6c8b5cc97363e544408b15c0fb369d7359c25dc04826eb6e1
    environment:
      MARIADB_ROOT_PASSWORD: drkit-test-only
      MARIADB_DATABASE: blog
      MARIADB_USER: app
      MARIADB_PASSWORD: drkit-test-only
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60

  app:
    # Stands in for an application writing user uploads to a named volume.
    image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    command: ["sh", "-c", "trap 'exit 0' TERM; while true; do sleep 1; done"]
    volumes:
      - uploads:/data

volumes:
  uploads:
