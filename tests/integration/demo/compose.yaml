# Demo project for restore tests: a database, and a web server that serves files from the
# git checkout (./www) and user uploads from a volume. Settings come from the project's .env,
# which drkit backs up as a secret. Images are pinned by digest; Dependabot proposes updates.
services:
  db:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: shop
    volumes:
      # The parent directory: PostgreSQL 18+ images keep the data in a per-version subdirectory.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # TCP on purpose: the entrypoint's temporary init server only listens on the socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d shop"]
      interval: 2s
      retries: 60

  web:
    image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    command: ["httpd", "-f", "-p", "8080", "-h", "/srv"]
    ports: ["127.0.0.1:${WEB_PORT}:8080"]
    volumes:
      - ./www:/srv/www:ro
      - uploads:/srv/uploads

volumes:
  pgdata:
  uploads:
